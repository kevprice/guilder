<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guild management verification</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="max-width: 750px; padding: 30px; margin: auto">
    <h1>Guild management verification</h1>
    <p>
      Launch a disposable local demo on port 4174 to check the full game UI. Each launch replaces
      only the demo origin’s save.
    </p>
    <div class="row">
      <button data-branch="hospice">Launch hospice demo</button>
      <button data-branch="laboratory">Launch laboratory demo</button>
      <button data-branch="decision">Launch expedition decision demo</button>
      <button data-branch="workshop">Launch refit and reclamation demo</button>
      <button data-branch="care">Launch care planning demo</button>
      <button data-branch="furniture">Launch furniture crafting demo</button>
      <button data-branch="house">Launch house production demo</button>
      <button data-branch="guard">Launch Mara defence demo</button>
      <button data-branch="patterns">Launch recipe discovery demo</button>
      <button data-branch="doors">Launch door puzzle demo</button>
      <button data-branch="keys">Launch contract key reward demo</button>
      <button data-branch="watch">Launch Bryn watch demo</button>
      <button data-branch="staff">Launch household workers demo</button>
    </div>
    <p id="result" role="status"></p>
    <script type="module">
      import * as D from './domain.js';
      import { grantFurniture } from './guild-management.js';
      import { gainLevel } from './classes.js';
      document.addEventListener('click', (event) => {
        const branch = event.target.dataset.branch;
        if (!branch) return;
        if (location.port !== '4174') {
          document.getElementById('result').textContent =
            'Use the isolated local preview at http://127.0.0.1:4174/guild-management-preview.html';
          return;
        }
        const s = D.initial({ opening: 'legacy' });
        s.flags.opening =
          s.flags.breach =
          s.flags.repaired =
          s.flags.ledger =
          s.flags.stairs =
          s.flags.wallSurveyed =
            true;
        s.flags.anchor =
          s.flags.tower =
          s.flags.gardenAnchor =
          s.flags.garden =
          s.flags.searched_sluice =
            true;
        s.flags.archiveSeal = s.flags.library = s.flags.libraryOpened = true;
        s.flags[branch === 'laboratory' ? 'laboratory' : 'hospice'] = true;
        if (branch === 'laboratory') s.flags.fenRoom2Ready = true;
        // The regional room's actual anchor is established by its existing definition.
        if (branch === 'laboratory')
          s.flags[D.rooms.find((r) => r.id === 'fenRoom2').anchor] = true;
        s.gold = 600;
        s.guild.salvage = 30;
        s.guild.supplies = 8;
        s.guild.blueprints = ['mill', 'drains', 'tower'];
        D.recruit(s, 'bryn');
        D.recruit(s, 'ivo');
        if (branch === 'staff') {
          for (const c of s.roster) gainLevel(c);
        }
        s.roster[0].str = 10;
        if (['house', 'guard', 'patterns', 'doors', 'watch'].includes(branch)) {
          s.flags.discovered_sluice =
            s.flags.searched_sluice =
            s.flags.discovered_study =
            s.flags.searched_study =
              true;
          s.flags.cellarDrained = s.flags.cellar = true;
          s.roster[0].str = 20;
          s.roster[0].end = 10;
          s.roster[1].int = 20;
          for (const m of D.materials) s.guild.house.materials[m.id] = 12;
          s.guild.house.materials.components = 0;
          D.assignRoomWorker(s, 'corridor', 0, 'bryn');
          D.assignRoomWorker(s, 'tower', 0, 'ivo');
        }
        if (branch === 'guard') {
          for (const flag of D.recruits.find((c) => c.id === 'nell').requires || [])
            s.flags[flag] = true;
          D.recruit(s, 'nell');
          s.guild.house.mara.tier = 3;
          D.assignRoomWorker(s, 'entrance', 0, 'bryn');
          s.threats.monster = {
            progress: 0,
            active: true,
            age: 0,
            damage: 0,
            room: 'service',
            x: 865,
            y: 380,
          };
        }
        if (branch === 'laboratory') {
          s.roster[1].status = 'injured';
          s.roster[1].injury = 2;
          s.roster[1].recovery = 5;
        }
        if (branch !== 'furniture')
          for (const id of ['forge', 'banner', 'rug', 'plant', 'raisedBeds', 'medicalCabinet'])
            grantFurniture(s, id);
        if (branch === 'workshop') {
          for (const id of ['shortSword', 'paddedCoat', 'buckler'])
            D.awardEquipment(s, id, 'Demo stores');
        }
        if (branch === 'care') {
          s.guild.supplies = 4;
          D.setGardenPolicy(s, 'reserve', 2);
          for (const [id, recovery] of [
            ['bryn', 12],
            ['ivo', 7],
          ]) {
            const c = s.roster.find((c) => c.id === id);
            c.status = 'injured';
            c.injury = 3;
            c.recovery = recovery;
          }
        }
        D.rememberPosition(s, 'rowan', { x: branch === 'hospice' ? 1670 : 860, floor: 380 });
        if (branch === 'patterns') {
          const study = D.chambers.find((r) => r.id === 'study');
          s.flags.searched_study = false;
          s.selected = 'ivo';
          D.rememberPosition(s, 'ivo', { x: study.x + 135, floor: study.y });
        }
        if (branch === 'doors') {
          s.selected = 'bryn';
          s.flags.key_drainKey = false;
          s.flags.searched_sluice = false;
          const door = D.passages.find((p) => p.id === 'cellDoor');
          const entrance = D.passages.find((p) => p.id === 'drainDoor');
          s.dungeonReturns = { sluice: { x: entrance.x, y: entrance.y, floor: entrance.y } };
          D.rememberPosition(s, 'bryn', { x: door.x, floor: door.y });
          s.guild.house.rooms.corridor.workers = [null];
          s.flags.towerCrown = true;
        }
        if (branch === 'watch') {
          D.enterStore(s, 'bryn');
          for (const id of ['shortSword', 'buckler']) {
            const uid = D.awardEquipment(s, id, 'Watch demo');
            D.equipItem(s, 'bryn', uid);
          }
          D.leaveStore(s);
          D.assignRoomWorker(s, 'entrance', 0, 'bryn');
          s.selected = 'bryn';
        }
        if (branch === 'keys') {
          s.flags.anchor = s.flags.tower = false;
          D.dispatch(s, 'anchor', ['bryn', 'ivo'], true);
          const mission = s.missions.at(-1);
          for (let n = 0; n < 10 && mission.status === 'travelling'; n++) {
            s.eventSeed = 97;
            D.day(s);
          }
          D.rememberPosition(s, 'rowan', { x: 350, floor: 380 });
        }
        if (branch === 'decision') {
          D.dispatch(s, 'survey_mill', ['bryn']);
          D.day(s);
        }
        D.discoverPatterns(s);
        D.refreshRouteProgress(s);
        s.scenes = [];
        localStorage.setItem('bound-house-auto', D.save(D.load(D.save(s))));
        location.href = '/';
      });
    </script>
  </body>
</html>
