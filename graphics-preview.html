<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Bound House · Graphics workshop</title><style>
body{margin:0;background:#141d28;color:#eadcc1;font:15px system-ui}main{max-width:1160px;margin:30px auto;padding:0 20px}h1,h2{font-family:Georgia;font-weight:400}h1{font-size:32px;margin-bottom:10px}p{color:#aebdbb;line-height:1.6}a{color:#dab98a}canvas{display:block;width:100%;height:auto;border:1px solid #82755966;border-radius:14px;background:#18242d}button{padding:9px 15px;color:#eadcc1;background:#293442;border:1px solid #a58d6266;border-radius:7px;margin-bottom:14px}button[aria-pressed=true]{background:#555044;border-color:#d9be83}.toolbar{display:flex;gap:8px}
</style></head><body><main><h1>The Bound House · living light, darker magic</h1><p>The same renderer used in the game. Close-up equipment, animated magic, distinct interiors and creature silhouettes. <a href="/">Return to the guild</a></p><div class="toolbar"><button id="rooms" aria-pressed="true">Rooms & companions</button><button id="monsters" aria-pressed="false">Monsters & combat</button><button id="motion" aria-pressed="false">Pause animation</button></div><canvas id="preview" width="1200" height="750" aria-label="Live graphics preview"></canvas></main><script type="module">
import {paintRoom,paintCharacter} from './artwork.js';
import {paintEquipment,paintCreature,paintSpell,paintRoomIdentity,glow} from './graphics-engine.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),ratio=Math.min(devicePixelRatio||1,2);canvas.width=1200*ratio;canvas.height=750*ratio;let mode='rooms',paused=false,clock=0,prev=0;
for(const id of ['rooms','monsters'])document.getElementById(id).onclick=()=>{mode=id;for(const tab of ['rooms','monsters'])document.getElementById(tab).setAttribute('aria-pressed',tab===id);};
document.getElementById('motion').onclick=()=>{paused=!paused;document.getElementById('motion').textContent=paused?'Resume animation':'Pause animation';document.getElementById('motion').setAttribute('aria-pressed',paused);};
function label(text,x,y){ctx.fillStyle='#dfcaa7';ctx.font='18px Georgia';ctx.textAlign='center';ctx.fillText(text,x,y);ctx.textAlign='left';}
function frame(now){const dt=Math.min((now-prev)/1000||0,.04);prev=now;if(!paused)clock+=dt;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#17232e';ctx.fillRect(0,0,1200,750);
if(mode==='rooms'){
 const names=['QUARTERS','RETURNED ARCHIVE','RECLAIMED GREENHOUSE','ASH FORGE','STAR OBSERVATORY','CORAL ARCHIVE'];
 const people=[{id:'bryn',name:'Bryn',type:'warrior',color:'#bd8868',specialisation:'paladin',gear:'oathShield'},{id:'ivo',name:'Ivo',type:'mage',color:'#a897c2',specialisation:'healer',gear:'wardStaff'},{id:'nell',name:'Nell',type:'scout',color:'#98b996',gear:'moonBow'},{id:'kest',name:'Kest',type:'warrior',color:'#c88763',gear:'emberBlade'},{id:'sable',name:'Sable',type:'mage',color:'#9da9d1',gear:'stormRod'},{id:'sal',name:'Sal',type:'scout',color:'#83b8b7',gear:'mistBoots'}];
 names.forEach((name,i)=>{ctx.save();ctx.translate(20+(i%3)*395,Math.floor(i/3)*325-160);ctx.scale(1.35,1.35);paintRoom(ctx,0,0,280,name,true,'A home with its own history');paintRoomIdentity(ctx,0,0,280,name,true,clock);paintCharacter(ctx,0,people[i],155,380,true,1);paintEquipment(ctx,0,people[i],155,380,clock,1);ctx.restore();});
 label('Warm rooms · readable equipment · living magic',600,722);
}else{
 const beasts=[['ghost','House ghost','ghost'],['wraith','Bell wraith','wraith'],['spider','Giant spider','spider'],['mimic','Treasury mimic','vaultmimic'],['golem','Bound fiend','boundfiend'],['hound','Rat king','ratking'],['slime','Spore beast','sporebeast'],['dragon','Furnace dragon','dragon'],['moth','Void swarm','moth']];
 beasts.forEach(([shape,name,id],i)=>{const x=200+i%3*400,y=165+Math.floor(i/3)*210;glow(ctx,x,y-30,110,'#725388',.12);ctx.save();ctx.translate(x,y);ctx.scale(1.35,1.35);paintCreature(ctx,0,0,0,shape,'#be8e99',clock,id);ctx.restore();label(name,x,y+42);});
 const mage={id:'ivo',name:'Healer',type:'mage',specialisation:'healer',color:'#b7a5d2',gear:'wardStaff'};paintCharacter(ctx,0,mage,500,728,false,1);paintEquipment(ctx,0,mage,500,728,clock);paintSpell(ctx,0,{x:500,y:728},{x:700,y:728},clock,'healer');label('Magic travels between the fighters',880,715);
}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
